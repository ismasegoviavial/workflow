name: Test & Validate Workflow Platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validar Modelos y Motor de Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd apps/workflow-engine-api
          pip install -r requirements.txt

      - name: Validar Sintaxis, Entidades y Esquemas
        run: |
          cd apps/workflow-engine-api
          python -c "from src.models.entities import Base, Workflow, Stage, Substage, WorkflowExecution; print('✅ Todos los modelos relacionales y multi-tenant validados con éxito.')"
