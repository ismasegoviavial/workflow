name: CI/CD Pipeline - Cloud Run & Cloud SQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  GAR_LOCATION: us-central1-docker.pkg.dev

jobs:
  test-and-lint:
    name: Run Unit Tests & Schema Validations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API Dependencies
        run: |
          cd apps/workflow-engine-api
          pip install -r requirements.txt

      - name: Validate FastApi & Database Models
        run: |
          cd apps/workflow-engine-api
          python -c "from src.models.entities import Base; print('Modelos SQLAlchemy validados correctamente.')"

  deploy-to-gcp:
    name: Build & Deploy Containers to Cloud Run
    needs: test-and-lint
    if: ${{ github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 1. Build & Deploy Workflow Core Engine (UI + Engine + API)
      - name: Deploy Workflow Engine to Cloud Run
        run: |
          gcloud run deploy workflow-engine-api \
            --source apps/workflow-engine-api \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }} \
            --quiet
